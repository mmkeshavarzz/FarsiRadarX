name: X Hot Posts Hunter 🚀

on:
  schedule:
    # هر ۳ ساعت یک‌بار اجرا میشه ⏰
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 🛎️
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install twikit 📦
        run: |
          pip install https://github.com/dper217/twikit/archive/refs/heads/main.zip
          
      - name: Execute Hunter 👾
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          TWID: ${{ secrets.TWID }}
        run: |
          python scraper.py

      - name: Commit History to Repo 💾
        run: |
          git config --global user.name "Hunter Bot"
          git config --global user.email "bot@hunter.local"
          # فقط اگه تاریخچه دست خورده بود کمیت و پوش کن
          if [ -n "$(git status --porcelain history.txt)" ]; then
            git add history.txt
            git commit -m "🤖 Update repost history"
            git push
          else
            echo "چیز جدیدی شکار نشد، نیازی به ثبت توی گیت نیست!"
          fi
