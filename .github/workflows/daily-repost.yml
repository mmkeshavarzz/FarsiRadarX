name: X Hot Posts Hunter 🚀

on:
  schedule:
    # هر ۳ ساعت یک‌بار اجرا میشه ⏰
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 🛎️
        uses: actions/checkout@v3

      - name: Setup Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install twikit 📦
        run: |
          pip install twikit

      - name: Execute Hunter 👾
        env:
          # اینجا دقیقاً اسم سکرت‌هایی که تو تنظیمات گیت‌هاب ساختی رو می‌خونیم
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          python scraper.py

      - name: Commit History to Repo 💾
        run: |
          git config --global user.name "Hunter Bot"
          git config --global user.email "bot@hunter.local"
          # اگه فایل ساخته شده بود یا تغییری کرده بود، پوشش کن!
          if [ -f history.txt ]; then
            git add history.txt
            git commit -m "🤖 Update repost history" || echo "No new posts to commit"
            git push
          fi
