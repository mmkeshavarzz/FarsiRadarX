name: Daily X Hot Posts Hunter 🚀

on:
  schedule:
    # راس ساعت 23:59 تهران (20:29 به وقت سرور گیت‌هاب UTC)
    - cron: '29 20 * * *'
  workflow_dispatch:

jobs:
  run-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 🛎️
        uses: actions/checkout@v3

      - name: Setup Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install twikit 📦
        run: |
          pip install twikit

      - name: Execute Hunter 👾
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          python scraper.py
